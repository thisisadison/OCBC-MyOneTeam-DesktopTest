<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCBC My OneTeam — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ec1c24; 
    --red-dark: #c20f17; 
    --red-tint: #fdecec;
    --ink: #14161b; 
    --ink2: #3a3f47; 
    --muted: #737984; 
    --line: #e9eaee; 
    --bg: #f5f6f8; 
    --card: #fff;
    --fi: #2f6fd6; 
    --funds: #ec1c24; 
    --cash: #0fa37f; 
    
    --alt: #7c3aed; 
    
    --ai1: #ec1c24; 
    --ai2: #c20f17;
    
    --green: #1f9d57; 
    --amber: #e08600;
    --r: 18px; 
    
    --shadow: 0 1px 2px rgba(18,20,28,.05), 0 10px 30px rgba(18,20,28,.07);
    
    --glow: 0 0 0 1px rgba(236,28,36,.25), 0 8px 30px rgba(236,28,36,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#111214;color:var(--ink);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px}
  h1,h2,h3,.disp{font-family:'Sora','Inter',sans-serif;letter-spacing:-.02em}

  .demobar{width:100%;max-width:900px;display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .demobar .brand{font-family:'Sora';font-weight:800;color:#b8790f;margin-right:auto;display:flex;align-items:center;gap:8px;font-size:15px}
  .demobar .brand small{color:var(--muted);font-weight:500;font-family:'Inter'}
  .demobar button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
  .demobar button:hover{background:#f6f7f9}
  .stepwrap{font-size:13px;color:var(--muted);font-weight:600}

  .phone{width:402px;max-width:97vw;background:#0a0b0d;border-radius:50px;padding:11px;box-shadow:0 0 0 2px rgba(255,255,255,.28),0 40px 80px rgba(0,0,0,.5);position:relative}
  .screen{background:var(--bg);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column;height:846px}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:32px;background:#0a0b0d;border-radius:20px;z-index:40}
  .statusbar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-size:13px;font-weight:600;color:var(--ink);position:relative;z-index:10}
  .statusbar.over{position:absolute;top:0;left:0;right:0;height:50px;background:transparent;color:#14161b;z-index:20}
  .statusbar.light{color:#fff}
  .statusbar.onhero{position:absolute;top:0;left:0;right:0;height:50px;background:transparent;color:var(--ink);z-index:20}
  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;min-height:0}
  .view::-webkit-scrollbar{width:0}
  .pad{padding:6px 22px 28px}

  .appbar{display:flex;align-items:center;gap:10px;padding:4px 18px 8px}
  .appbar .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
  .appbar .ttl{font-size:13px;font-weight:700;color:var(--muted)}
  .appbar .ologo{margin-left:auto;font-family:'Sora';font-weight:800;color:var(--red);font-size:15px}
  .ologo-gold{display:flex;align-items:center;gap:5px;background:linear-gradient(160deg,#f3d68d 0%,#d3a347 55%,#a8701f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ologo-mark{width:17px;height:17px;flex-shrink:0}

  h1{font-size:25px;line-height:1.18;margin:8px 0 6px;font-weight:800}
  h2{font-size:15px;margin:18px 0 9px;font-weight:700;font-family:'Sora'}
  .sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px}
  p.copy{font-size:14.5px;line-height:1.55;color:var(--ink2)}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
  .eyebrow.ai{background:linear-gradient(120deg,var(--ai1),var(--ai2));-webkit-background-clip:text;background-clip:text;color:transparent}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);margin-bottom:13px}
  .card.flat{box-shadow:none}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:11px;transition:transform .05s,filter .15s,box-shadow .2s;font-family:'Inter'}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(236,28,36,.28)}
  .btn.primary:hover{filter:brightness(1.04)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.ai{background:linear-gradient(120deg,#ec1c24,#c20f17);color:#fff;box-shadow:0 8px 20px rgba(236,28,36,.28)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f7f8fa}
  .btn.link{background:transparent;color:var(--red);box-shadow:none}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(236,28,36,.28)}50%{box-shadow:0 8px 30px rgba(236,28,36,.5)}}
  @keyframes pulseGold{0%,100%{box-shadow:0 8px 20px rgba(190,134,45,.30)}50%{box-shadow:0 8px 32px rgba(190,134,45,.55)}}
  .btn.gold.glowpulse{animation:pulseGold 2.2s ease-in-out infinite}
  .judgebtn{background:#fff;color:#a87b1f;border:1.5px solid #caa23a;position:relative;overflow:hidden;animation:judgeGlow 2.4s ease-in-out infinite}
  @keyframes judgeGlow{0%,100%{box-shadow:0 4px 14px rgba(202,162,58,.18)}50%{box-shadow:0 6px 22px rgba(202,162,58,.42)}}
  .glowpulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes gp{0%,100%{box-shadow:0 8px 24px rgba(236,28,36,.3)}50%{box-shadow:0 8px 34px rgba(236,28,36,.55)}}

  .trust{background:var(--red-tint);border:1px solid #f7d2d4;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.45;color:#7a1d22;margin:14px 0}
  .trust b{color:var(--red-dark)}
  .note{font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
  .field{width:100%;border:1px solid var(--line);border-radius:13px;padding:15px;font-size:15px;background:#fff;margin-bottom:10px;font-family:'Inter'}

  /* questionnaire */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:13px}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .qhead .miniframe{border-radius:50%;overflow:hidden;line-height:0;flex-shrink:0;box-shadow:0 2px 6px rgba(18,20,28,.12)}
  .stepbadge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--red);background:var(--red-tint);padding:5px 12px;border-radius:20px;margin-bottom:10px}
  .verdictcard{background:var(--ink);color:#fff;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 14px 36px rgba(18,20,28,.28)}
  .verdictcard .vhead{display:flex;align-items:center;gap:11px}
  .verdictcard .veyebrow{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#f5c518}
  .verdictcard .vtitle{font-family:'Sora';font-weight:800;font-size:18px;margin-top:1px}
  .verdictcard .vsub{font-size:12px;line-height:1.5;color:rgba(255,255,255,.7);margin:11px 0 14px}
  .vbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .vbar .vbl{display:flex;align-items:center;gap:7px;width:108px;flex-shrink:0;font-size:12px;font-weight:600}
  .vbar .vsw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .vbar .vtrack{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
  .vbar .vtrack span{display:block;height:100%;border-radius:5px;transition:width .6s ease}
  .vbar .vpc{width:40px;text-align:right;font-family:'Sora';font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

  /* returning-user home */
  .livedot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:lp 1.8s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .pilotHero{position:relative;background:linear-gradient(135deg,#c9a04a 0%,#b8873c 22%,#a3762f 48%,#c9a04a 65%,#96692a 100%);color:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 26px rgba(120,85,20,.30),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(60,40,10,.25),inset 0 0 0 1px rgba(255,235,190,.18);overflow:hidden}
  .pilotHero::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,244,215,.22),transparent);pointer-events:none}
  .pilotHero::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.16) 45%,transparent 60%);pointer-events:none}
  .pilotHero>*{position:relative;z-index:1}
  .pilotHero .hbar{height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
  .pilotHero .hbar span{display:block;height:100%;background:#fff;border-radius:5px}
  .promo.activeppl{position:relative;background:linear-gradient(135deg,#f3d68d 0%,#e8bd66 30%,#d9a44a 60%,#e8bd66 100%);border:1px solid #b8863c;box-shadow:0 10px 26px rgba(150,105,30,.28),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(120,80,20,.18);overflow:hidden}
  .promo.activeppl::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);pointer-events:none}
  .promo.activeppl>*{position:relative;z-index:1}
  .activeppl .pt{color:#3a2a0a}.activeppl .pd{color:#5a4620}
  .activeppl .livedot{box-shadow:0 0 0 0 rgba(52,211,153,.6),0 0 8px rgba(227,176,74,.5)}
  .feedcard{background:linear-gradient(180deg,#fffdf9,#fff);border:1px solid #e8d6a8;border-radius:15px;padding:14px;box-shadow:0 3px 10px rgba(190,150,60,.08);margin-bottom:11px}
  .feedcard.hot{border-color:#e8d6a8;background:linear-gradient(180deg,#fffbf3,#fff)}
  .feedtop{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .feedtop .miniframe{border-radius:50%;overflow:hidden;line-height:0;flex-shrink:0;box-shadow:0 2px 6px rgba(18,20,28,.12)}
  .feedname{font-family:'Sora';font-weight:800;font-size:13.5px}
  .feedtime{font-size:11px;color:var(--muted)}
  .newdot{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.05em;background:linear-gradient(160deg,#e3b04a,#b8790f);color:#fff;padding:3px 7px;border-radius:6px}
  .feedtext{font-size:13px;line-height:1.5;color:var(--ink2);margin-bottom:11px}
  .feedact{display:flex;gap:9px;align-items:center}
  .fbtn{background:#fff;border:1px solid #e3cb92;border-radius:11px;padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
  .reviewcard{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fffdf9,#fff);border:1px solid #e8d6a8;border-radius:15px;padding:14px;box-shadow:0 3px 10px rgba(190,150,60,.08);cursor:pointer}
  .reviewcard .opt-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .propcard{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#fffdf9,#fff);border:1.5px solid #e8d6a8;border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.12s}
  .propcard.on{border-color:#a6710f;background:linear-gradient(180deg,#fff6de,#fffaf0)}
  .propcard .miniframe{border-radius:50%;overflow:hidden;line-height:0;flex-shrink:0}
  .propt{font-family:'Sora';font-weight:800;font-size:13.5px}
  .propd{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
  .propchk{width:24px;height:24px;border-radius:50%;border:1.5px solid #d2d5da;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;flex-shrink:0}
  .propcard.on .propchk{background:linear-gradient(160deg,#e3b04a,#b8790f);border-color:#b8790f}
  .qname{font-family:'Sora';font-weight:800;font-size:14px}
  .qdesc{font-size:11.5px;color:var(--muted)}
  .qfield{margin-top:11px}
  .qfield label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
  .qtag{font-size:9px;font-weight:800;background:#eef3ff;color:#2f6fd6;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
  .qinwrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
  .qinwrap:focus-within{border-color:var(--red)}
  .qpfx{padding:0 4px 0 11px;color:var(--muted);font-weight:700;font-size:13px}
  .qsfx{padding:0 11px;color:var(--muted);font-weight:600;font-size:12px}
  .qin{flex:1;min-width:0;border:none;outline:none;padding:12px 11px;font-size:15px;font-weight:700;font-family:'Sora';background:transparent;color:var(--ink)}
  .amtinwrap{flex:1;border-radius:9px}
  .amtin{padding:8px 8px;font-size:13.5px}
  .rkopts{display:flex;flex-wrap:wrap;gap:7px}
  .rkopt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.12s;text-align:left}
  .rkopt.on{border-color:var(--red);background:var(--red-tint);color:var(--red)}
  .qq{display:flex;gap:9px;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:11px}
  .qnum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .rccard{background:linear-gradient(135deg,#fff,#fffaf0);border:1.5px solid #e8cf94;border-radius:16px;padding:17px;margin:4px 0 16px;box-shadow:0 10px 26px rgba(190,134,45,.12)}
  .rceyebrow{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a6710f}
  .rclabel{font-family:'Sora';font-weight:800;font-size:21px;margin:2px 0 6px;color:var(--ink)}
  .rcdesc{font-size:13px;line-height:1.5;color:var(--ink2)}
  .rcdiv{height:1px;background:#ecdbb0;margin:13px 0}
  .rcport{font-family:'Sora';font-weight:800;font-size:16px;color:var(--ink);margin-top:2px}
  .rcnote{font-size:11.5px;color:var(--muted);margin-top:5px}
  .addcount{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:700}
  .regwrap{display:flex;flex-wrap:wrap;gap:7px}
  .regchip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.12s}
  .regchip.on{border-color:var(--red);background:var(--red-tint);color:var(--red)}
  .feedtag{font-size:11.5px;color:var(--muted);font-weight:600;background:#f4f4f5;border-radius:8px;padding:7px 10px;text-align:center}
  .learnlink{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:#a6710f;cursor:pointer}

  /* OCBC Singapore pre-login */
  .ocbcpre{min-height:100%;background:#fff;position:relative}
  .oltop{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;position:relative;z-index:2}
  .oltop .olicon{font-size:17px;color:#33373d;width:26px;text-align:center}
  .onetokenpill{background:#0c1f17;color:#3ddc97;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;letter-spacing:.02em}
  .oherowrap{padding:14px 22px 6px;text-align:center;position:relative;z-index:1}
  .oherotext{font-size:15px;color:#3a3f47;line-height:1.45;margin-bottom:12px}
  .oherotext b{color:var(--red);font-weight:800}
  .oheroimg{border-radius:14px;overflow:hidden;max-width:300px;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .ogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;padding:20px 16px 8px}
  .ogi{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#33373d;font-weight:500;cursor:pointer;padding:8px 4px;border-radius:12px}
  .ogi:active{background:#f6f7f9}
  .ogic{width:46px;height:46px;border-radius:14px;background:#f4f5f7;display:flex;align-items:center;justify-content:center;font-size:18px;color:#c0392b}
  .ologin-wrap{position:sticky;bottom:0;background:#fff;padding:8px 16px 0;margin-top:auto;box-shadow:0 -8px 20px rgba(255,255,255,.95)}
  .ologin{width:100%;background:#3a4754;color:#fff;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;font-family:'Sora';cursor:pointer;display:block}
  .ologin:active{background:#2c3741}
  .loginBtnOverlay{position:absolute;border:1px solid rgba(230,190,110,.4);background:linear-gradient(165deg,#f6e2ab 0%,#e8c164 32%,#cf9f45 62%,#b17e28 100%);color:#2a1c05;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px rgba(180,130,40,.28);padding:0;margin:0;cursor:pointer;border-radius:6px;font-family:'Sora',sans-serif;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
  .loginBtnOverlay:active{filter:brightness(.97)}
  .omaint{font-size:11px;color:#6b7280;line-height:1.45;padding:10px 2px 16px}
  .omaint b{color:#3a3f47}
  .omaint a{color:var(--red);font-weight:600;cursor:pointer}

  /* option cards (next step) */
  .optcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);margin-bottom:11px;cursor:pointer;transition:.12s}
  .optcard:hover{border-color:#d7dbe2;transform:translateY(-1px)}
  .optcard.hot{border-color:#f6c9cb;background:#fffafa}
  .optcard .opt-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;font-weight:800}
  .opt-t{font-family:'Sora';font-weight:800;font-size:14px;line-height:1.25}
  .opt-d{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
  .opt-go{margin-left:auto;color:var(--muted);font-size:22px;font-weight:300}
  .optcard .opt-t{font-size:14.5px}
  .amttag{margin-left:auto;font-family:'Sora';font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;gap:12px}
  .kpi{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .kpi:last-child{border-bottom:none}
  .good{color:var(--green)}.warn{color:var(--amber)}.muted{color:var(--muted)}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0}

  /* AI co-pilot */
  .ai-strip {
    position: relative;
    /* Swapped lavender gradient to a soft red/tint gradient */
    background: linear-gradient(120deg, var(--red-tint), #fffcfc);
    /* Swapped to a soft red border */
    border: 1px solid #fbcbc9;
    border-radius: 16px;
    padding: 13px 14px;
    margin-bottom: 13px;
    overflow: hidden;
  }

  .ai-strip::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(var(--ai1), var(--ai2));
  }

  .ai-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 6px;
  }

  .ai-orb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ai1), var(--ai2));
    box-shadow: var(--glow);
    position: relative;
    flex-shrink: 0;
  }

  .ai-orb::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .55);
    animation: breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(.7); opacity: .5; }
    50% { transform: scale(1); opacity: .9; }
  }

  /* 3D net-mesh background — Building Your Plan screen (canvas-driven, see #netmesh JS) */
  .netmesh-wrap{position:absolute;top:0;left:0;right:0;height:420px;overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(180deg,#fdf6ea 0%,#f9f0dd 40%,#f6ecd8 65%,var(--bg) 100%)}
  #netmesh{display:block;width:100%;height:100%}

  .ai-name {
    font-family: 'Sora';
    font-weight: 700;
    font-size: 13px;
    background: linear-gradient(120deg, var(--ai1), var(--ai2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .ai-msg {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink2); 
  }

  .ai-msg b {
    color: var(--red-dark); 
  }

  /* segmented */
  .seg{display:flex;gap:7px;background:#eceef1;border-radius:13px;padding:4px;margin:6px 0 12px}
  .seg .s{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
  .seg .s.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

  /* goal cards */
  .goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .goal{border:1.5px solid var(--line);border-radius:16px;padding:15px;background:#fff;cursor:pointer;transition:.15s}
  .goal .ge{font-size:26px}
  .goal .gt{font-weight:700;font-size:14px;margin-top:8px;font-family:'Sora'}
  .goal .gd{font-size:12px;color:var(--muted);margin-top:2px}
  .goal.sel{border-color:var(--red);background:var(--red-tint);box-shadow:0 8px 20px rgba(236,28,36,.12)}

  /* link rows */
  .lrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer;transition:.15s}
  .lrow:hover{border-color:#d7d9df}
  .lrow .li{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;font-weight:800;font-size:13px;font-family:'Sora'}
  .lrow .ln{font-weight:700;font-size:14px}.lrow .lx{font-size:12px;color:var(--muted)}
  .lpill{margin-left:auto;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px}
  .lpill.todo{background:#eef0f3;color:var(--ink2)}
  .lpill.done{background:#e7f6ee;color:var(--green)}

  .meter{height:14px;background:#eceef1;border-radius:20px;overflow:hidden;margin:6px 0}
  .meter>span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--ai1),var(--ai2));transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .confbig{font-family:'Sora';font-weight:800;font-size:30px;background:linear-gradient(120deg,var(--ai1),var(--ai2));-webkit-background-clip:text;background-clip:text;color:transparent}

  /* agent run */
  .agentrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);opacity:.4;transition:opacity .4s}
  .agentrow.on{opacity:1}
  .agentrow:last-child{border-bottom:none}
  .agentrow .ai-orb{width:30px;height:30px}
  .agentrow .an{font-weight:700;font-size:14px;font-family:'Sora'}
  .agentrow .ad{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
  .agentrow .tick{margin-left:auto;color:var(--green);font-weight:900;opacity:0;transition:opacity .3s}
  .agentrow.done .tick{opacity:1}

  .signal{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;transition:box-shadow .15s}
  .signal:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .signal .se{font-size:20px}
  .signal .st{font-weight:600;font-size:13px;color:var(--ink);line-height:1.5;margin-top:3px}
  .signal .sd{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:1px}

  /* donut + buckets */
  .donutwrap{display:flex;align-items:center;gap:16px}
  .bigval{font-family:'Sora';font-size:27px;font-weight:800;letter-spacing:-.02em}
  .bk{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;cursor:pointer}
  .bk .bn{font-weight:600}.bk .bv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

  .bucketcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;transition:border .15s}
  .bktabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
  .bktab{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;transition:.15s;white-space:nowrap}
  .bktab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .bktab-on{color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  /* clean segmented control (attachment style) */
  .segtabs{display:grid;grid-template-columns:repeat(4,1fr);background:#eceef1;border-radius:13px;padding:4px;gap:3px;margin-bottom:14px}
  .segtab{border:none;background:transparent;border-radius:10px;padding:10px 4px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
  .segtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .bktabpct{font-weight:800;opacity:.85;margin-left:1px}
  .bucketcard.dragover{border-color:var(--ai2);box-shadow:var(--glow);background:#fcfbff}
  .bchead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .bchead .dot{width:13px;height:13px;border-radius:4px}
  .bchead .bname{font-weight:800;font-size:15px;font-family:'Sora'}
  .bchead .bpct{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
  .bsub{font-size:12px;color:var(--muted);margin-bottom:8px}
  input[type=range]{-webkit-appearance:none;flex:1;height:7px;border-radius:7px;background:#e7e8ec;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.22);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);cursor:pointer}
  .pm{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1}

  .prod{display:flex;align-items:center;gap:9px;background:#f8f9fb;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-top:7px;font-size:12.5px;cursor:grab}
  .prod:active{cursor:grabbing}
  .prod .pn{font-weight:700}
  .prod .hv{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#eef3ff;color:#2f6fd6;white-space:nowrap}
  .prod .hv.ow{background:#e7f6ee;color:var(--green)}
  .prod .why{font-size:11px;color:var(--ai2);font-weight:600}
  .prod .px{margin-left:auto;color:var(--muted);font-weight:800;cursor:pointer;padding:0 4px}
  .prod.shelf{cursor:grab;background:#fff;border-style:dashed}
  .prod .addamt{margin-left:auto;font-size:11px;font-weight:800;color:var(--green)}
  .prod.shelf .px{margin-left:8px}
  .prodc{background:#f8f9fb;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-top:7px}
  .prodc .prow{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .prodc .pn{font-weight:700}
  .prodc .hv{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#e7f6ee;color:var(--green);white-space:nowrap}
  .prodc .px{margin-left:auto;color:var(--muted);font-weight:800;cursor:pointer;padding:0 4px}
  .prodc .amtline{display:flex;align-items:center;gap:9px;margin-top:8px}
  .prodc .amtbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);line-height:1}
  .prodc .amtv{font-family:'Sora';font-weight:800;font-size:13.5px;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
  .prodc .why{font-size:11px;color:var(--ai2);font-weight:600}
  .bname{text-transform:uppercase;letter-spacing:.02em}
  .shelfwrap{background:linear-gradient(120deg,#f7f6ff,#fff);border:1px dashed #d9d2f5;border-radius:16px;padding:13px;margin-bottom:12px}
  .shelfhint{font-size:12px;color:var(--ai2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}

  .alloc{display:flex;justify-content:space-between;font-weight:800;padding:11px 13px;border-radius:13px;margin:2px 0 4px}
  .alloc.ok{background:#e7f6ee;color:var(--green)}.alloc.under{background:#fff6e8;color:var(--amber)}

  /* chart */
  .chartcard{background:var(--ink);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
  .chartcard .seg{background:rgba(255,255,255,.1)}
  .chartcard .seg .s{color:rgba(255,255,255,.6)}
  .chartcard .seg .s.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
  .goalbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.12)}

  .picker{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:8px;display:flex;gap:6px}
  .picker button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-weight:700;font-size:12px;cursor:pointer}

  /* paper trading */
  .pos{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
  .pos:last-child{border-bottom:none}
  .pos .pnm{font-weight:700}.pos .psub{font-size:11px;color:var(--muted)}
  .pos .pval{margin-left:auto;text-align:right}
  .pos .pv{font-weight:800;font-variant-numeric:tabular-nums}

  .toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:86%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .done-ic{width:74px;height:74px;border-radius:50%;background:#e7f6ee;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:38px;margin:8px auto 14px}

  .spinner{width:50px;height:50px;border-radius:50%;border:5px solid #ece8ff;border-top-color:var(--ai2);animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .ohead{background:linear-gradient(150deg,#ec1c24,#a90c12);color:#fff;padding:8px 22px 50px;border-radius:0 0 30px 30px}
  .ohead .hi{font-size:14px;opacity:.9}.ohead .amt{font-family:'Sora';font-size:31px;font-weight:800;margin-top:4px}
  .qtray{background:#fff;border-radius:18px;margin:-36px 18px 0;padding:14px 8px;box-shadow:var(--shadow);display:flex;justify-content:space-around}
  .qtray .q{font-size:11px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center}
  .qtray .qi{width:42px;height:42px;border-radius:13px;background:var(--red-tint);display:flex;align-items:center;justify-content:center;font-size:18px}
  .promo {
    margin: 14px -8px 0;
    border-radius: 22px;
    padding: 22px 22px;
    color: var(--ink);
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fffefb, #fdf3e2);
    border: 1.5px solid rgba(196,138,26,.3);
    box-shadow: 0 14px 30px rgba(196,138,26,.16), 0 4px 14px rgba(20,10,5,.06);
  }
  .promo .pt{font-family:'Sora';font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .promo .pd{font-size:13px;opacity:.85;margin:7px 0 13px;line-height:1.45}
  .promo .pb{background:linear-gradient(135deg,#e0a83e,#b8791f);color:#fff;font-weight:800;border:none;border-radius:12px;padding:13px;width:100%;cursor:pointer;font-family:'Inter';font-size:14.5px;box-shadow:0 8px 20px rgba(184,121,31,.35)}
  .promo .spark{position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.1}

  

  /* AI team roster */
  .teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
  .pixframe{width:56px;margin:0 auto;border-radius:50%;overflow:hidden;line-height:0;box-shadow:0 4px 12px rgba(18,20,28,.12)}
  .pixframe.gold{box-shadow:0 0 0 2px #f5c518,0 6px 16px rgba(202,162,58,.35)}
  .acard .anm{font-family:'Sora';font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;margin-top:9px;line-height:1.15}
  .riskpips{display:flex;gap:4px;justify-content:center;margin-top:7px}
  .riskpips .pip{width:16px;height:5px;border-radius:3px;background:#e4e6ea}
  .riskpips .pip.on1{background:#0fa37f}.riskpips .pip.on2{background:#e08600}.riskpips .pip.on3{background:#ec1c24}
  .acard .asp{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
  .acard .arg{font-size:11px;color:var(--ai2);font-weight:600;margin-top:7px;line-height:1.3}
  .judgecard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#191920,#3a2f12);color:#fff;border:2px solid #f5c518;border-radius:18px;padding:15px;box-shadow:0 12px 30px rgba(202,162,58,.28)}
  .judgecard .jn{font-family:'Sora';font-weight:800;font-size:14px;color:#f5c518;text-transform:uppercase;letter-spacing:.03em}
  .judgecard .jd{font-size:12px;opacity:.9;margin-top:4px;line-height:1.45}
  .bucketcard.nodrop{border-color:#ef4444;background:#fef2f2}
  .clschip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap}

  /* selectable agent cards */
  .acard.sel-card{cursor:pointer;position:relative;border:1.5px solid var(--line);transition:.15s}
  .acard.sel-card.sel{border-color:var(--red);background:var(--red-tint);box-shadow:0 8px 18px rgba(236,28,36,.12)}
  .acard .selcheck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:1.5px solid #d2d5da;color:transparent;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .acard.sel .selcheck{background:var(--red);border-color:var(--red);color:#fff}
  .addrow{font-size:12px;font-weight:700;color:var(--ink2);margin:11px 0 2px;display:flex;align-items:center;gap:6px;cursor:pointer;background:#f7f8fa;border:1px solid var(--line);border-radius:11px;padding:11px 12px}

  .disc{font-size:10.5px;color:var(--muted);line-height:1.4;margin:8px 2px 2px;text-align:center}

  .signal .miniframe{width:34px;flex-shrink:0;border-radius:50%;overflow:hidden;line-height:0;box-shadow:0 2px 6px rgba(18,20,28,.12)}
  .signal .byag{font-size:10px;font-weight:800;color:var(--ai2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}


  /* Agent accordion stack */
  .agrow{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
  .agrow-sel{border-color:var(--red);background:var(--red-tint);box-shadow:0 6px 18px rgba(236,28,36,.10)}
  .agrow-head{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .agrow-check{width:22px;height:22px;border-radius:50%;border:1.5px solid #d2d5da;color:transparent;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0}
  .agrow-check-on{background:var(--red);border-color:var(--red);color:#fff}

  /* ===== gold theme: build-your-ai-team screen ===== */
  .stepbadge.gold{color:#a6710f;background:#fbe8bf}
  .agcard-gold{background:linear-gradient(180deg,#fffbf3,#fff);border:1.5px solid #e3cb92;border-radius:16px;padding:14px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s,background .2s;position:relative;box-shadow:0 3px 10px rgba(190,150,60,.09)}

  .btn.gold{background:linear-gradient(160deg,#f3d68d 0%,#e3be67 25%,#d3a347 55%,#be862d 100%);color:#1F2229;box-shadow:inset 0 1px 0 1px rgba(255,255,255,.5),0 8px 20px rgba(190,134,45,.30);border-radius:12px}

  /* Goal chat interface */

  .chat-known-row span:last-child{font-weight:800;color:var(--ink)}

function lifesimScenarioFor(text){
  const t=(text||'').toLowerCase();
  for(const c of LIFESIM_CHIPS){
    if(c.id==='others')continue;
    if(t.includes(c.label.toLowerCase())||t.includes(c.id))return c.id;
  }
  for(const [id,words] of Object.entries(LIFESIM_KEYWORDS)){
    if(words.some(w=>t.includes(w)))return id;
  }
  return null;
}
/* Pulls a dollar amount out of free text in whatever format someone naturally types it —
   "$2mil", "2 million", "S$1,800,000", "800k", or a bare number — trying the more specific,
   less ambiguous patterns first before falling back to a bare 4+ digit number. */
function lifesimParseAmount(text){
  const patterns=[
    [/(?:s?\$)?\s*([\d,]+\.?\d*)\s*(?:mil(?:lion)?|m)\b/i, 1000000],
    [/(?:s?\$)?\s*([\d,]+\.?\d*)\s*k\b/i, 1000],
    [/s?\$\s*([\d,]+\.?\d*)/i, 1],
    [/\b(\d{4,}(?:,\d{3})*)\b/, 1] // bare 4+ digit number as a last resort, avoids matching small numbers like "5" from "5 years"
  ];
  for(const [re,mult] of patterns){
    const m=text.match(re);
    if(m){
      const n=parseFloat(m[1].replace(/,/g,''));
      if(!isNaN(n))return Math.round(n*mult);
    }
  }
  return null;
}
/* Pulls a timeframe out of free text — "next year", "in 3 years", "6 months from now" —
   converting months to a fractional-year figure so it's consistent with how years are used elsewhere. */
function lifesimParseYears(text){
  const t=text.toLowerCase();
  if(/next year/.test(t))return 1;
  if(/this year/.test(t))return 0.5;
  let m=t.match(/(\d+\.?\d*)\s*months?\s*(?:from now|later|out|away|time)?/);
  if(m)return Math.round((parseFloat(m[1])/12)*10)/10;
  m=t.match(/(?:in|within|next)?\s*(\d+\.?\d*)\s*years?\s*(?:from now|later|out|away|time)?/);
  if(m)return parseFloat(m[1]);
  return null;
}

/* Result lookup table: [riskScore][planCategory] -> archetype id. planCategory: 0 = deliberate (score 0), 1 = spontaneous (score 1-2) */
const MBTI_LOOKUP={
  '0_0':'anchor', '0_1':'cloud',
  '1_0':'stone',  '1_1':'cloud',
  '2_0':null,     '2_1':'balloon',   // 2_0 resolved via Q6
  '3_0':'compass','3_1':'bolt'
};
function mbtiResolve(riskScore,planScore){
  // Per the spec: if planning score = 1 (one deliberate, one spontaneous answer),
  // Q4 (the windfall-spending question) is the decider rather than a true midpoint.
  const planCat=planScore===0?0:1;
  const key=riskScore+'_'+planCat;
  const id=MBTI_LOOKUP[key];
  if(id===null)return null; // needs Q6 (risk=2, plan=0)
  return archetypeById(id);
}

function shade(hex,amt){
  const h=hex.replace('#','');
  let r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function riskIndex(){

  const yrs=horizon()||state.years||6;
  let idx = app<1.5?0 : app<2.0?1 : app<2.5?2 : app<2.9?3 : 4;
  if(yrs>=12 && idx<4) idx++;                 // long runway → can take a bit more risk
  else if(yrs<=3 && idx>0) idx--;             // very short → dial back
  return Math.max(0,Math.min(4,idx));

function applyRiskTilt(){const d=riskIndex()-2;if(!d)return; // Balanced(2) = neutral
  const growth=['Funds','Alt'],defensive=['FI','Cash'];
  const step=Math.abs(d)*6,from=d>0?defensive:growth,to=d>0?growth:defensive;
  let pool=0;from.forEach(k=>{const take=Math.min(state.buckets[k],Math.round(step/from.length));state.buckets[k]-=take;pool+=take;});
  to.forEach(k=>{state.buckets[k]+=Math.round(pool/to.length);});
  let tot=KEYS4.reduce((s,k)=>s+state.buckets[k],0);if(tot!==100){const big=KEYS4.reduce((a,b)=>state.buckets[b]>state.buckets[a]?b:a,'FI');state.buckets[big]+=100-tot;}}

function projChart(){
  const yrs=horizon();const pts=projSeries();const n=pts.length-1;
  const W=320,H=160,padL=40,padR=12,padT=12,padB=20;
  const target=targetVal(), maxV=Math.max(target*1.06,Math.max.apply(null,pts)*1.06), minV=Math.min.apply(null,pts)*.94;
  const plotW=W-padL-padR, plotH=(H-padB)-padT;
  const X=i=>padL+i/n*plotW, Y=v=>(H-padB)-(v-minV)/(maxV-minV)*plotH;
  let out=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  // y gridlines + value labels
  for(let g=0;g<=3;g++){const yy=padT+g*plotH/3;const val=maxV-(g/3)*(maxV-minV);
    out+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.08)"/>`;
    out+=`<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-family="Inter" font-size="8" fill="#9aa0aa">S$${Math.round(val/1000)}k</text>`;}
  // axis lines
  out+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="rgba(255,255,255,.28)"/>`;
  out+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="rgba(255,255,255,.28)"/>`;
  // target line
  const gy=Y(target);out+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="#9aa0aa" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  out+=`<text x="${W-padR}" y="${(gy-5).toFixed(1)}" text-anchor="end" font-family="Inter" font-size="9" fill="#c7ccd4">Target S$${(target/1000).toFixed(0)}k</text>`;
  // area + line
  let d='';for(let i=0;i<=n;i++){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(pts[i]).toFixed(1)+' ';}
  out+=`<path d="${d}L ${X(n).toFixed(1)} ${H-padB} L ${X(0).toFixed(1)} ${H-padB} Z" fill="url(#ga)" opacity=".45"/>`;
  out+=`<path d="${d}" fill="none" stroke="url(#g1)" stroke-width="2.4" stroke-linejoin="round"/>`;
  // news markers
  NEWS.forEach(ev=>{const i=Math.round(ev.x*n);const x=X(i),y=Y(pts[i]);const col=ev.dir>0?'#34d399':'#fb7185';
    out+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="${col}" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>`;
    out+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${col}" stroke="#14161c" stroke-width="2"/>`;
    out+=`<text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="8.5" fill="${col}">${ev.dir>0?'+':'–'}</text>`;});
  // sim 'you are here'
  if(state.simT){const i=Math.min(n,Math.round((state.simT/yrs)*n));out+=`<line x1="${X(i).toFixed(1)}" y1="${padT}" x2="${X(i).toFixed(1)}" y2="${H-padB}" stroke="#fff" stroke-width="1.4" opacity=".8"/><circle cx="${X(i).toFixed(1)}" cy="${Y(pts[i]).toFixed(1)}" r="4.5" fill="#fff"/>`;}
  out+=`<circle cx="${X(n).toFixed(1)}" cy="${Y(pts[n]).toFixed(1)}" r="4" fill="#fff"/>`;
  // x-axis year labels
  [0,Math.round(n/3),Math.round(2*n/3),n].forEach(i=>{const yr=2025+Math.round((i/n)*yrs);
    out+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i>=n?'end':'middle'}" font-family="Inter" font-size="8" fill="#9aa0aa">${i===0?'Now':yr}</text>`;});
  out+=`<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ec1c24"/><stop offset="1" stop-color="#ff7a80"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec1c24"/><stop offset="1" stop-color="#ec1c24" stop-opacity="0"/></linearGradient></defs></svg>`;
  return out;
}

mbtiQuiz(){
  const m=state.mbti;
  const onQ6=m.step>=MBTI_Q.length;
  const totalSteps=MBTI_Q.length+(m.needsQ6?1:0);
  const pct=Math.round((m.step/totalSteps)*100);
  let q,onA,onB;
  if(!onQ6){
    q=MBTI_Q[m.step];
    onA=`mbtiAnswer('a')`;onB=`mbtiAnswer('b')`;
  }else{
    q=MBTI_Q6;
    onA=`mbtiAnswerQ6('${q.a.id}')`;onB=`mbtiAnswerQ6('${q.b.id}')`;
  }
  return `<div style="position:relative">
  <div style="position:relative;z-index:1;padding-top:50px">${appbar('Financial Profile','mbtiIntro',false,true)}<div class="pad" style="padding-bottom:32px">

  <div class="mbtiprogwrap">
    <div class="mbtiprog"><span style="width:${pct}%"></span></div>
    <div class="mbtiprognum">${Math.min(m.step+1,totalSteps)} / ${totalSteps}</div>
  </div>

  ${q.img?`<div class="mbtiphoto"><img src="${q.img}" alt="${q.eyebrow||''}"></div>`:''}
  <div class="mbtistory">
    <div class="mbtistory-glow"></div>
    <div class="mbtistory-spark s1">✦</div><div class="mbtistory-spark s2">✦</div><div class="mbtistory-spark s3">✧</div>
    ${!q.img?`<div class="mbtistory-icon">${q.icon||'✨'}</div>`:''}
    <div class="mbtiq-eyebrow">${q.eyebrow?q.eyebrow:(onQ6?'One more, to be sure':(q.axis==='risk'?'Risk instinct':'Planning style'))}</div>
    <div class="mbtiq-text">${mbtiFormatStory(q.q)}</div>
  </div>

  <div class="mbtiopts">
    <div class="mbtiopt" onclick="${onA}"><span class="mbtiopt-ic">${q.a.ic||'◆'}</span><div class="mbtiopt-label">${q.a.label}</div></div>
    <div class="mbtiopt-or">or</div>
    <div class="mbtiopt" onclick="${onB}"><span class="mbtiopt-ic">${q.b.ic||'◆'}</span><div class="mbtiopt-label">${q.b.label}</div></div>
  </div>

  ${m.step>0?`<a class="mbtiback" onclick="mbtiBack()">← Back</a>`:''}
</div></div></div>`;},

function setActiveBucket(k){
  state.activeBucket=k;
  const tabsEl=$('bktabs');
  const tabsScrollX=tabsEl?tabsEl.scrollLeft:0;
  keepScroll(()=>{
    $('buckets').innerHTML=renderBuckets();
    const newTabsEl=$('bktabs');
    if(newTabsEl){
      newTabsEl.scrollLeft=tabsScrollX;

          activeTab.scrollIntoView({behavior:'smooth',inline:'nearest',block:'nearest'});
        }

/* ===== new-flow helpers ===== */
const ORCH_WANT={home:'protect the timeline, stay liquid',retire:'compound hard over decades',grow:'put idle cash to work in equities',income:'steady payouts from bonds & REITs'};
function AGENT_ADVICE(id){const M={
  home:'Comfortable here — enough stays within reach to protect your property plans as the date nears.',
  retire:'Let it run. Time in the market is doing the heavy lifting; resist the urge to tinker.',
  grow:'This finally puts your idle cash to work. Given your horizon you could even lean a touch bolder.',
  income:'The income sleeve should start paying you within the first quarter. Sensible and cash-flow friendly.'};
  return M[id]||'This looks reasonable for your situation.';}
function COACH_BASE(k){return `I'm watching your ${BK[k].name} basket. Add or drop funds and I'll tell you what each move does to your plan — like a coach reading the board.`;}
function bucketCoach(action,p){const k=p.cls,tk=prodTicker(p.name),g=state.goalLabel||'goal';
  const L={
    Funds:{add:`Bolder growth tilt with ${tk}. With your home loan to service, keep some cash buffer so a dip never forces your hand.`,remove:`Trimming equities lowers growth — fine if you're nervous, but you have time on your side for your ${g}.`},
    FI:{add:`${tk} steadies the ride — sensible while your ${g} is in sight.`,remove:`Less fixed income means a bumpier ride; watch this as your goal date nears.`},
    Cash:{add:`More cash means more safety and liquidity for your loan, but it's a drag on growth at your horizon.`,remove:`Cutting cash frees money to grow — just keep enough for emergencies and repayments.`},
    Alt:{add:`${tk} diversifies away from equities — a useful satellite. Keep it modest.`,remove:`Fewer alternatives means less of a cushion if equities wobble.`}};
  return (L[k]&&L[k][action])||(action==='tune'?`Updated ${tk} to S$${(p.amt||0).toLocaleString()} — that shifts ${BK[k].name} to ${state.buckets[k]}% of your plan.`:"Noted — I've reweighted your basket.");}
function prodTicker(name){const m=name.match(/\(([^)]+)\)/);if(m)return m[1];return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function prodPct(p){const t=totalVal()||1;return Math.round((p.amt||0)/t*100);}
function productList(k,withGrowth){const ps=PRODUCTS.filter(p=>p.bucket===k);

/* ===== volatile projection series (real ups & downs + news shocks) ===== */
function projSeries(){const n=Math.max(24,horizon()*12),r=pRetEff()/12,base=Math.max(1000,state.invest);const pts=[];
  for(let i=0;i<=n;i++){const t=i/n;
    const drift=base*Math.pow(1+r,i)+(state.monthly>0?state.monthly*((Math.pow(1+r,i)-1)/r):0);
    let shock=0;NEWS.forEach(ev=>{const d=t-ev.x;shock+=ev.dir*0.14*Math.exp(-Math.pow(d*7,2));});
    const wave=Math.sin(i*0.55)*0.055+Math.sin(i*0.27+1)*0.038+Math.sin(i*1.15+2)*0.022;
    pts.push(Math.max(base*0.6,drift*(1+wave+shock)));}
  return pts;}

/* ===== live sandbox projection (updates as you add/remove) ===== */
function sandProjValue(yrs){const r=pRetEff(),rm=r/12,n=(yrs||horizon())*12;let v=(totalVal()||0)*Math.pow(1+rm,n);
  if(state.monthly>0)v+=state.monthly*((Math.pow(1+rm,n)-1)/rm);return Math.round(v);}
function sandSeries(){const n=Math.max(24,horizon()*12),r=pRetEff()/12,base=totalVal()||0;const pts=[];
  for(let i=0;i<=n;i++){let v=base*Math.pow(1+r,i)+(state.monthly>0?state.monthly*((Math.pow(1+r,i)-1)/r):0);
    const wave=Math.sin(i*0.5)*0.016+Math.sin(i*0.23+1)*0.011;pts.push(v*(1+wave));}
  return pts;}
function sandMiniChart(){const pts=sandSeries(),n=pts.length-1,t=targetVal(),yrs=horizon();
  const W=300,H=146,padL=48,padR=14,padT=16,padB=38;
  const aiv=state._aiProj||pts[n];
  const ceil=Math.max(t,aiv,Math.max.apply(null,pts))*1.08, floor=Math.min(POOL,pts[0],Math.min.apply(null,pts))*0.95;
  const plotW=W-padL-padR, plotH=(H-padB)-padT;
  const X=i=>padL+i/n*plotW,Y=v=>(H-padB)-(v-floor)/(ceil-floor)*plotH;
  const ok=pts[n]>=t,col=ok?'#1f9d57':'#c47712',gy=Y(t);
  let out=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="spjfill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="1" stop-color="${col}" stop-opacity="0"/>
      </linearGradient>
    </defs>`;
  // 2 horizontal gridlines with real value labels (top & bottom of plot), for an actual readable scale
  [0,1].forEach(g=>{const yy=padT+g*plotH,val=ceil-g*(ceil-floor);
    out+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="rgba(20,22,27,.08)"/>`;
    out+=`<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-family="Inter" font-size="8" fill="#8a8d93">S$${Math.round(val/1000)}k</text>`;});
  // axis lines — y-axis (value) and x-axis (time), framing the plot area
  out+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#14161b" stroke-width="1"/>`;
  out+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#14161b" stroke-width="1"/>`;
  // goal line — solid black, clearly distinct from AI plan
  out+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="#14161b" stroke-width="1.4" stroke-dasharray="5 3"/>`;
  // AI plan reference — dotted, grey, visually distinct dash pattern from goal line
  if(state._aiProj){const ay=Y(state._aiProj);out+=`<line x1="${padL}" y1="${ay.toFixed(1)}" x2="${W-padR}" y2="${ay.toFixed(1)}" stroke="#8a8d93" stroke-width="1.4" stroke-dasharray="1.5 3.5"/>`;}
  // area + projection line
  let d='';for(let i=0;i<=n;i++)d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(pts[i]).toFixed(1)+' ';
  out+=`<path d="${d}L ${X(n).toFixed(1)} ${H-padB} L ${X(0).toFixed(1)} ${H-padB} Z" fill="url(#spjfill)"/>`;
  out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  // starting point marker (small filled dot) + ending point (larger ringed dot)
  out+=`<circle cx="${X(0).toFixed(1)}" cy="${Y(pts[0]).toFixed(1)}" r="2.6" fill="#8a8d93"/>`;
  out+=`<circle cx="${X(n).toFixed(1)}" cy="${Y(pts[n]).toFixed(1)}" r="4.2" fill="#fff" stroke="${col}" stroke-width="2.6"/>`;

  [0,Math.round(n/2),n].forEach(i=>{const yr=2025+Math.round((i/n)*yrs);
    out+=`<text x="${(X(i)+(i===0?4:0)).toFixed(1)}" y="${H-padB+13}" text-anchor="${i===0?'start':i>=n?'end':'middle'}" font-family="Inter" font-size="8" fill="#8a8d93">${i===0?'Now':yr}</text>`;});

  out+=`<text x="0" y="0" transform="translate(12,${(padT+(H-padB))/2}) rotate(-90)" text-anchor="middle" font-family="Inter" font-weight="700" font-size="8.5" fill="#5b5e64" letter-spacing="0.02em">PORTFOLIO VALUE</text>`;
  out+=`</svg>`;
  return `<div class="spjchartwrap">${out}</div>
    <div class="spjlegend">
      <span class="lgi"><span class="ln solid" style="border-color:${col}"></span>Projected · S$${Math.round(pts[n]/1000)}k</span>
      <span class="lgi"><span class="ln dash" style="border-color:#14161b"></span>Goal · S$${Math.round(t/1000)}k</span>
      ${state._aiProj?`<span class="lgi"><span class="ln dot" style="border-color:#8a8d93"></span>AI Plan · S$${Math.round(state._aiProj/1000)}k</span>`:''}
    </div>`;}

function stressChart(ev,r){const v0=r.v0,trough=r.trough,rec=ev.recover,total=Math.round(rec*1.35)+1;
  const W=300,H=104,padL=40,padR=10,padT=10,padB=20;
  const pts=[];const tDip=Math.max(1,Math.round(rec*0.14));
  for(let m=0;m<=total;m++){let v;
    if(m<=tDip)v=v0+(trough-v0)*(m/tDip);
    else if(m<=rec){const f=(m-tDip)/(rec-tDip);v=trough+(v0-trough)*Math.pow(f,.85);}
    else v=v0*(1+0.05*((m-rec)/12));
    pts.push(v);}
  const n=pts.length-1,ti=pts.indexOf(Math.min.apply(null,pts));
  const minV=Math.min.apply(null,pts)*.99,maxV=Math.max.apply(null,pts)*1.01;
  const X=i=>padL+i/n*(W-padL-padR),Y=v=>(H-padB)-(v-minV)/(maxV-minV)*((H-padB)-padT);
  let d1='',d2='';pts.forEach((v,i)=>{if(i<=ti)d1+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';if(i>=ti)d2+=(i===ti?'M':'L')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});
  const by=Y(v0),reci=Math.min(n,rec);
  let out=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  // y-axis value labels at top and bottom of plot
  out+=`<text x="${padL-6}" y="${(padT+3).toFixed(1)}" text-anchor="end" font-family="Inter" font-size="8" fill="#8a8d93">S$${Math.round(maxV/1000)}k</text>`;

function stressBars(ev){const held=KEYS4.filter(k=>bucketVal(k)>0);if(!held.length)return'';

  return `<div class="stressbars-h">How each part of your mix held up</div>${held.map(k=>{
    const s=ev.shock[k]||0,pos=s>=0,w=Math.max(4,Math.min(100,Math.abs(s)/maxMag*100));
    return `<div class="sbrow"><span class="sblbl"><span class="sbdot" style="background:${BK[k].hex}"></span>${BK[k].name}</span>
      <div class="sbtrack"><div class="sbfill" style="width:${w}%;background:${pos?'#1f9d57':'#e0454d'}"></div></div>
      <span class="sbval" style="color:${pos?'#1f9d57':'#e0454d'}">${pos?'+':''}${s}%</span></div>`;}).join('')}`;}

function sparkline(series){const W=320,H=70,pad=4,n=series.length-1;if(n<1)return'';
  const min=Math.min(...series)*.999,max=Math.max(...series)*1.001;
  const X=i=>pad+i/n*(W-2*pad),Y=v=>H-pad-(v-min)/(max-min||1)*(H-2*pad);
  let d='';series.forEach((v,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');
  const up=series[n]>=series[0];const col=up?'#34d399':'#fca5a5';
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${X(n)}" cy="${Y(series[n])}" r="3.5" fill="#fff"/></svg>`;}

/* Produces a scaled copy of a scenario's holistic figures based on what the user actually entered
   (cost and years-until-purchase), instead of always using the scenario's fixed default numbers. */
/* Combines multiple scenario picks (e.g. car + condo) into one summed pseudo-scenario, so every
   downstream function (impact rows, comparisons, the Orchestrator's explanation) can keep working
   with a single scenario-shaped object regardless of whether one or several decisions were combined. */
function lifesimCombinedScenario(decision){
  const scaled=decision.picks.map(p=>lifesimScaledScenario(p.scenario,p.cost,p.years));
  const labelFor=(p,i)=>p.label||LIFESIM_SCENARIOS[p.scenario].label;
  if(scaled.length===1){
    const only=Object.assign({},scaled[0],{label:labelFor(decision.picks[0])});
    return Object.assign({},only,{_picks:[{scenarioId:decision.picks[0].scenario,sc:only}]});
  }
  const totalCost=scaled.reduce((s,sc)=>s+(sc.cost||0),0);
  const combinedHolistic={
    monthlyHit: scaled.reduce((s,sc)=>s+sc.holistic.monthlyHit,0),
    retireDelay: Math.round(scaled.reduce((s,sc)=>s+sc.holistic.retireDelay,0)*10)/10,
    emgBefore: scaled[0].holistic.emgBefore,
    emgAfter: Math.max(0,Math.round((scaled[0].holistic.emgBefore-scaled.reduce((s,sc)=>s+(scaled[0].holistic.emgBefore-sc.holistic.emgAfter),0))*10)/10),
    homeSame: scaled.every(sc=>sc.holistic.homeSame),
    homeNote: scaled.every(sc=>sc.holistic.homeSame) ? 'None of these draw from your home savings.' : scaled.find(sc=>!sc.holistic.homeSame).holistic.homeNote
  };
  const label=decision.picks.map((p,i)=>labelFor(p,i)).join(' + ');
  const summary=`combining ${decision.picks.length} decisions together, ${combinedHolistic.monthlyHit>1500?'this is a meaningful stretch on your plan':'this is achievable'}. We'll make a few adjustments across the board to keep your long-term goals on track.`;
  const combinedImpacts={};
  ['income','grow','retire','home'].forEach(agentId=>{
    const lines=decision.picks.map(p=>LIFESIM_SCENARIOS[p.scenario].impacts[agentId]);
    combinedImpacts[agentId]={
      impact: lines.map(l=>l.impact).join(' '),
      action: lines[lines.length-1].action
    };
  });
  return {
    label, cost:totalCost, years:null, summary,
    holistic:combinedHolistic, impacts:combinedImpacts,
    reduce: decision.picks.flatMap(p=>LIFESIM_SCENARIOS[p.scenario].reduce),
    _picks: decision.picks.map((p,i)=>({scenarioId:p.scenario,sc:scaled[i]}))
  };
}
/* Centralised so every screen shows the same figure and it only needs updating in one place.
   ~S$120k/year persona: after CPF and living costs, a realistic monthly surplus sits well above
   the old 1.6x multiplier (which produced just S$4,000 — thin enough that almost any real
   decision looked like it nearly wiped the person out). 2.6x lands around S$6,500/month, which
   still shows a genuine, felt impact from a big decision without every scenario reading as a crisis. */
function lifesimCurrentSurplus(){
  return Math.round((state.monthly||2500)*2.6);
}
function lifesimScaledScenario(scenarioId,userCost,userYears){
  const base=LIFESIM_SCENARIOS[scenarioId]||LIFESIM_SCENARIOS.car;
  const baseCost=base.cost;
  const h=base.holistic;
  // Scenarios with no dollar cost (currently just "Retire Earlier") are scaled by years instead —
  // the baseline retireDelay figure represents a 5-year-earlier retirement, so scale proportionally
  // against whatever the user actually entered instead of ignoring their input.
  const isYearsBased = baseCost===0 && h.retireDelay!==0;
  const baseYears = isYearsBased ? Math.abs(h.retireDelay) : null;
  const ratio = isYearsBased ? 1 : (baseCost>0 ? Math.max(0.15,(userCost!=null?userCost:baseCost)/baseCost) : 1);
  const yearsRatio = isYearsBased && userYears!=null && userYears>0 ? userYears/baseYears : 1;
  const yearsFactor=(!isYearsBased && userYears!=null && userYears>0) ? Math.max(0.4,3/userYears) : 1; // sooner purchase = sharper near-term impact
  const scaledMonthlyHit=Math.round(h.monthlyHit*ratio*yearsFactor);
  const scaledRetireDelay=isYearsBased ? Math.round((h.retireDelay*yearsRatio)*10)/10 : Math.round((h.retireDelay*ratio)*10)/10;
  const scaledEmgAfter=Math.max(0,Math.round((h.emgBefore-(h.emgBefore-h.emgAfter)*(isYearsBased?yearsRatio:ratio))*10)/10);
  return Object.assign({},base,{
    cost:(userCost!=null?userCost:baseCost),
    years:(userYears!=null?userYears:null),
    holistic:Object.assign({},h,{monthlyHit:scaledMonthlyHit,retireDelay:scaledRetireDelay,emgAfter:scaledEmgAfter})
  });
}

  return {title:'Monthly cash flow',

/* The Orchestrator's own synthesis of how a number was reached — draws on every agent's
   findings but is written as a single voice explaining the reasoning, rather than showing
   each agent as its own separate expandable row (which felt cluttered with 5 things to open). */
function lifesimOrchestratorExplain(sc,rowId){
  const h=sc.holistic;
  const isCombo=sc._picks&&sc._picks.length>1;
  const comboLead=isCombo?`Adding up ${sc._picks.length} decisions together: `:'';

  if(rowId==='retire'){
    const delay=h.retireDelay;
    const monthlyContribution=state.monthly||2500;
    const monthlyLifestyle=Math.round((state.target||1500000)/25/12); // reverse the 25x-annual-expenses rule to estimate monthly cost of living

    if(!sc.cost && sc.years){
      const yearsShort=Math.abs(delay);
      return `Here's the calculation: ${comboLead}I looked at what you spend monthly to maintain your current lifestyle — about ${fmtSGD(monthlyLifestyle)} — to work out what your savings need to cover once you stop working. Retiring ${sc.years} year${sc.years!==1?'s':''} earlier means ${sc.years} fewer year${sc.years!==1?'s':''} of contributions at your current rate of ${fmtSGD(monthlyContribution)}/month going toward that pot. To still afford your current lifestyle without that shortfall, you'd need to work about ${yearsShort} extra year${yearsShort!==1?'s':''} — which is the push-back you're seeing.`;
    }
    if(delay===0){
      return `Here's the calculation: ${comboLead}I checked ${fmtSGD(sc.cost||0)} against your current savings and monthly contributions, and it doesn't dip into the money set aside for retirement — so your retirement date doesn't move.`;
    }
    const dir = delay>0 ? 'push back' : 'bring forward';
    const monthsOfLifestyle=Math.max(1,Math.round((sc.cost||0)/monthlyLifestyle));
    return `Here's the calculation: ${comboLead}I worked out your monthly cost of maintaining your current lifestyle — about ${fmtSGD(monthlyLifestyle)} — since that's what your retirement savings ultimately need to cover. ${isCombo?`Together, these decisions come to ${fmtSGD(sc.cost||0)}`:fmtSGD(sc.cost||0)}, roughly ${monthsOfLifestyle} month${monthsOfLifestyle!==1?'s':''} worth of that lifestyle — money that would otherwise have kept going into your retirement savings at ${fmtSGD(monthlyContribution)}/month. To make up for that gap and still retire able to afford your current lifestyle, you'd need to ${dir} your retirement by about ${Math.abs(delay)} year${Math.abs(delay)!==1?'s':''}.`;
  }

  if(rowId==='home'){
    const homeAgent=AGENTS.find(a=>a.id==='home')||{target:400000,years:6};
    const homeTarget=homeAgent.target, homeYears=homeAgent.years;
    const homeMonthly=Math.round(homeTarget/Math.max(1,homeYears)/12);
    if(h.homeSame){
      return `Here's the calculation: ${comboLead}your home goal needs ${fmtSGD(homeTarget)} saved over ${homeYears} years — about ${fmtSGD(homeMonthly)}/month. I checked whether ${isCombo?'any of these decisions come':fmtSGD(sc.cost||0)+' comes'} out of that same monthly amount, and ${isCombo?'none do':"it doesn't"} — ${isCombo?"they're":"it's"} funded separately, so your home goal timeline stays at ${homeYears} years, untouched.`;
    }
    return `Here's the calculation: ${comboLead}your home goal needs ${fmtSGD(homeTarget)} saved over ${homeYears} years — about ${fmtSGD(homeMonthly)}/month. ${isCombo?'At least one of these decisions draws':fmtSGD(sc.cost||0)+' draws'} from that same pool of savings rather than sitting separately, so the goals are now competing for the same money. ${h.homeNote}`;
  }

  if(rowId==='emg'){
    const monthlyLifestyle=Math.round((state.target||1500000)/25/12);
    const bufferBeforeAmt=Math.round(h.emgBefore*monthlyLifestyle);
    const bufferAfterAmt=Math.round(h.emgAfter*monthlyLifestyle);
    const pulled=bufferBeforeAmt-bufferAfterAmt;
    return `Here's the calculation: ${comboLead}at your monthly expenses of about ${fmtSGD(monthlyLifestyle)}, your emergency fund of ${fmtSGD(bufferBeforeAmt)} covers ${h.emgBefore} months today. Of the ${isCombo?fmtSGD(sc.cost||0)+' combined':fmtSGD(sc.cost||0)} for ${isCombo?'these decisions':'this decision'}, I estimated about ${fmtSGD(pulled)} would realistically come out of that cash buffer rather than your investments, leaving ${fmtSGD(bufferAfterAmt)} — which covers ${h.emgAfter} months.`;
  }

  // default: cashflow
  const hit=h.monthlyHit;
  const currentSurplus=lifesimCurrentSurplus();
  if(hit===0){
    return `Here's the calculation: ${comboLead}your current monthly surplus is about ${fmtSGD(currentSurplus)}. ${isCombo?'These decisions add':'This decision adds'} no new recurring expense, so that surplus is unaffected — your monthly cash flow stays the same.`;
  }
  const first=sc._picks?sc._picks[0]:null;
  const base=first?LIFESIM_SCENARIOS[first.scenarioId]:null;
  const baseCost=base?base.cost:null;
  const baseHit=base?base.holistic.monthlyHit:hit;
  const showsWorking = !isCombo && sc.cost && baseCost && sc.cost!==baseCost;
  let workingLine;
  if(showsWorking){
    workingLine = ` The typical figure for "${base.label}" is ${fmtSGD(baseCost)}, costing about ${fmtSGD(baseHit)} a month — scaling that to your ${fmtSGD(sc.cost)} figure${sc.years?`, over ${sc.years} year${sc.years!==1?'s':''},`:''} gives about ${fmtSGD(Math.abs(hit))} a month.`;
  }else if(sc.cost){
    workingLine = ` That's based on ${fmtSGD(sc.cost)} in expected repayments, loan interest, and any added running costs.`;
  }else{
    workingLine='';
  }
  if(hit>0){
    const newSurplus=currentSurplus-hit;
    return `Here's the calculation: ${comboLead}your current monthly surplus is about ${fmtSGD(currentSurplus)}. ${isCombo?'Together, these decisions add':'This decision adds'} about ${fmtSGD(hit)} in new monthly costs, which brings that down to about ${fmtSGD(newSurplus)}.${workingLine}`;
  }
  return `Here's the calculation: ${comboLead}${isCombo?'these decisions require':'this decision requires'} setting aside about ${fmtSGD(Math.abs(hit))} in new monthly savings, on top of your current monthly surplus of about ${fmtSGD(currentSurplus)}, to stay on track.${workingLine}`;
}

window._netMeshRAF = window._netMeshRAF || null;
function initNetMesh(){
  if(window._netMeshRAF){cancelAnimationFrame(window._netMeshRAF);window._netMeshRAF=null;}
  const canvas=document.getElementById('netmesh');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);

  const COLS=30,ROWS=20;
  const SPACING=21;
  let W=0,H=0,t=0;

  function resize(){
    const rect=canvas.parentElement.getBoundingClientRect();
    W=rect.width;H=rect.height;
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize',resize);

  // Camera / perspective params — low, wide terrain-flyover angle like a landscape horizon
  const focal=210;
  const camY=-55;
  const tiltX=0.98;

  function project(x,y,z){
    const ry=y*Math.cos(tiltX)-z*Math.sin(tiltX);
    const rz=y*Math.sin(tiltX)+z*Math.cos(tiltX)+focal;
    const scale=focal/Math.max(rz,1);
    return {
      x:W/2+x*scale,
      y:H*0.20+(ry-camY)*scale,
      scale
    };
  }

  function frame(){
    t+=0.005;
    ctx.clearRect(0,0,W,H);

    // precompute projected grid points with smooth, gentle wave displacement for calm terrain motion
    const pts=[];
    for(let r=0;r<ROWS;r++){
      pts[r]=[];
      for(let c=0;c<COLS;c++){
        const gx=(c-(COLS-1)/2)*SPACING;
        const gy=(r-(ROWS-1)/2)*SPACING;
        const wave=Math.sin(gx*0.04+t)*11 + Math.cos(gy*0.05+t*0.7)*9;
        pts[r][c]=project(gx,gy,wave);
      }
    }

    function depthOf(p){return Math.max(0,Math.min(1,(p.scale-0.42)/0.62));}

    ctx.lineWidth=0.8;
    ctx.lineCap='round';
    // horizontal + vertical grid lines only — no diagonals, for a calmer, cleaner look
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const p=pts[r][c];
        const depthFade=depthOf(p);
        if(depthFade<0.03)continue;
        const alpha=0.055+depthFade*0.19;
        ctx.strokeStyle='rgba(200,158,88,'+alpha+')';
        if(c<COLS-1){const p2=pts[r][c+1];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
        if(r<ROWS-1){const p2=pts[r+1][c];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
      }
    }
    // soft dots at every intersection, brighter and larger with depth
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const p=pts[r][c];
        const depthFade=depthOf(p);
        if(depthFade<0.08)continue;
        ctx.fillStyle='rgba(224,178,88,'+(0.18+depthFade*0.48)+')';
        ctx.beginPath();ctx.arc(p.x,p.y,0.6+depthFade*1.3,0,Math.PI*2);ctx.fill();
      }
    }

    window._netMeshRAF=requestAnimationFrame(frame);
  }
  frame();
}
function stopNetMesh(){
  if(window._netMeshRAF){cancelAnimationFrame(window._netMeshRAF);window._netMeshRAF=null;}
}

/* Precisely align the tappable login button with the "Log in to OCBC Wealth
   Management" button already drawn inside images/background/ocbc-ea-login.jpg.
   The image is shown with object-fit:cover so it always fills the phone frame
   exactly (no gap below it, whatever the frame's aspect ratio), which means
   part of the image is cropped to fit. This function reconstructs how the
   image was scaled and cropped (standard object-fit:cover math, centered),
   then maps the button's position — defined as a percentage of the ORIGINAL
   uncropped artwork — into the visible, cropped box, so it lines up with the
   real button pixel-for-pixel regardless of the frame's size or aspect ratio. */
const LOGIN_BTN_BOX={left:0.07971,top:0.84219,width:0.82884,height:0.05803};
function positionLoginBtn(){
  const img=$('loginImg'),btn=$('loginBtnOverlay');
  if(!img||!btn||!img.naturalWidth)return;
  const rw=img.clientWidth,rh=img.clientHeight;
  if(!rw||!rh)return;
  const nw=img.naturalWidth,nh=img.naturalHeight;
  const scale=Math.max(rw/nw,rh/nh);
  const renderedW=nw*scale,renderedH=nh*scale;
  const offsetX=(renderedW-rw)/2,offsetY=(renderedH-rh)/2;
  btn.style.position='absolute';
  btn.style.left=(LOGIN_BTN_BOX.left*renderedW-offsetX)+'px';
  btn.style.top=(LOGIN_BTN_BOX.top*renderedH-offsetY)+'px';
  btn.style.width=(LOGIN_BTN_BOX.width*renderedW)+'px';
  btn.style.height=(LOGIN_BTN_BOX.height*renderedH)+'px';
}

}
function nudgeChromeCollapse(){
  if(window.innerWidth>480)return; // only on real mobile widths, not the desktop phone mockup
  window.scrollTo(0,1);
  setTimeout(()=>window.scrollTo(0,1),300);
}
window.addEventListener('load',nudgeChromeCollapse);
window.addEventListener('orientationchange',()=>setTimeout(nudgeChromeCollapse,300));

render();
nudgeChromeCollapse();
setTimeout(preloadAllImages,300);
</script>
